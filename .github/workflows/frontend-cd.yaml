name: Frontend Continuous Deployment

on:
  push:
      branches:
            - main
                paths:
                      - 'starter/frontend/**'
                        workflow_dispatch:

                        jobs:
                          checks:
                              name: Frontend Checks
                                  runs-on: ubuntu-latest
                                      defaults:
                                            run:
                                                    working-directory: starter/frontend

                                                        steps:
                                                              - name: Checkout source
                                                                      uses: actions/checkout@v4

                                                                            - name: Set up Node.js
                                                                                    uses: actions/setup-node@v4
                                                                                            with:
                                                                                                      node-version: 18.x
                                                                                                                cache: npm
                                                                                                                          cache-dependency-path: starter/frontend/package-lock.json

                                                                                                                                - name: Install dependencies
                                                                                                                                        run: npm ci

                                                                                                                                              - name: Run lint
                                                                                                                                                      run: npm run lint

                                                                                                                                                            - name: Run tests
                                                                                                                                                                    run: CI=true npm test

                                                                                                                                                                      build:
                                                                                                                                                                          name: Build and Push Frontend Image
                                                                                                                                                                              runs-on: ubuntu-latest
                                                                                                                                                                                  needs: checks

                                                                                                                                                                                      outputs:
                                                                                                                                                                                            image: ${{ steps.build-image.outputs.image }}

                                                                                                                                                                                                steps:
                                                                                                                                                                                                      - name: Checkout source
                                                                                                                                                                                                              uses: actions/checkout@v4

                                                                                                                                                                                                                    - name: Configure AWS credentials
                                                                                                                                                                                                                            uses: aws-actions/configure-aws-credentials@v4
                                                                                                                                                                                                                                    with:
                                                                                                                                                                                                                                              aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                                                                                                                                                                                                                                                        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                                                                                                                                                                                                                                                                  aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
                                                                                                                                                                                                                                                                            aws-region: ${{ vars.AWS_REGION }}

                                                                                                                                                                                                                                                                                  - name: Login to Amazon ECR
                                                                                                                                                                                                                                                                                          id: ecr
                                                                                                                                                                                                                                                                                                  uses: aws-actions/amazon-ecr-login@v2

                                                                                                                                                                                                                                                                                                        - name: Build and push Docker image
                                                                                                                                                                                                                                                                                                                id: build-image
                                                                                                                                                                                                                                                                                                                        working-directory: starter/frontend
                                                                                                                                                                                                                                                                                                                                env:
                                                                                                                                                                                                                                                                                                                                          REGISTRY: ${{ steps.ecr.outputs.registry }}
                                                                                                                                                                                                                                                                                                                                                    REPOSITORY: ${{ vars.FRONTEND_ECR_REPOSITORY }}
                                                                                                                                                                                                                                                                                                                                                              IMAGE_TAG: ${{ github.sha }}
                                                                                                                                                                                                                                                                                                                                                                        MOVIE_API_URL: ${{ secrets.REACT_APP_MOVIE_API_URL }}
                                                                                                                                                                                                                                                                                                                                                                                run: |
                                                                                                                                                                                                                                                                                                                                                                                          IMAGE="$REGISTRY/$REPOSITORY:$IMAGE_TAG"
                                                                                                                                                                                                                                                                                                                                                                                                    docker build --build-arg REACT_APP_MOVIE_API_URL="$MOVIE_API_URL" -t "$IMAGE" .
                                                                                                                                                                                                                                                                                                                                                                                                              docker push "$IMAGE"
                                                                                                                                                                                                                                                                                                                                                                                                                        echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

                                                                                                                                                                                                                                                                                                                                                                                                                          deploy:
                                                                                                                                                                                                                                                                                                                                                                                                                              name: Deploy Frontend
                                                                                                                                                                                                                                                                                                                                                                                                                                  runs-on: ubuntu-latest
                                                                                                                                                                                                                                                                                                                                                                                                                                      needs: build

                                                                                                                                                                                                                                                                                                                                                                                                                                          steps:
                                                                                                                                                                                                                                                                                                                                                                                                                                                - name: Checkout source
                                                                                                                                                                                                                                                                                                                                                                                                                                                        uses: actions/checkout@v4

                                                                                                                                                                                                                                                                                                                                                                                                                                                              - name: Configure AWS credentials
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      uses: aws-actions/configure-aws-credentials@v4
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              with:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      aws-region: ${{ vars.AWS_REGION }}

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            - name: Set up kubectl
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    uses: azure/setup-kubectl@v4
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            with:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      version: v1.31.0

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            - name: Set up Kustomize
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    uses: imranismail/setup-kustomize@v2

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          - name: Configure Kubernetes
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}" --region "${{ vars.AWS_REGION }}"

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        - name: Deploy Frontend
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                working-directory: starter/frontend/k8s
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  kustomize edit set image frontend=${{ needs.build.outputs.image }}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            kustomize build | kubectl apply -f -
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      kubectl rollout status deployment/frontend --timeout=180s