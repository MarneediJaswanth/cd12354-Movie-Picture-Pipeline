name: Frontend Continuous Integration

on:
  pull_request:
      branches:
            - main
                paths:
                      - 'starter/frontend/**'
                        workflow_dispatch:

                        jobs:
                          lint:
                              name: Lint Frontend
                                  runs-on: ubuntu-latest
                                      defaults:
                                            run:
                                                    working-directory: starter/frontend

                                                        steps:
                                                              - name: Checkout source
                                                                      uses: actions/checkout@v4

                                                                            - name: Set up Node.js
                                                                                    uses: actions/setup-node@v4
                                                                                            with:
                                                                                                      node-version: 18.x
                                                                                                                cache: npm
                                                                                                                          cache-dependency-path: starter/frontend/package-lock.json

                                                                                                                                - name: Install dependencies
                                                                                                                                        run: npm ci

                                                                                                                                              - name: Run lint
                                                                                                                                                      run: npm run lint

                                                                                                                                                        test:
                                                                                                                                                            name: Test Frontend
                                                                                                                                                                runs-on: ubuntu-latest
                                                                                                                                                                    defaults:
                                                                                                                                                                          run:
                                                                                                                                                                                  working-directory: starter/frontend

                                                                                                                                                                                      steps:
                                                                                                                                                                                            - name: Checkout source
                                                                                                                                                                                                    uses: actions/checkout@v4

                                                                                                                                                                                                          - name: Set up Node.js
                                                                                                                                                                                                                  uses: actions/setup-node@v4
                                                                                                                                                                                                                          with:
                                                                                                                                                                                                                                    node-version: 18.x
                                                                                                                                                                                                                                              cache: npm
                                                                                                                                                                                                                                                        cache-dependency-path: starter/frontend/package-lock.json

                                                                                                                                                                                                                                                              - name: Install dependencies
                                                                                                                                                                                                                                                                      run: npm ci

                                                                                                                                                                                                                                                                            - name: Run tests
                                                                                                                                                                                                                                                                                    run: CI=true npm test

                                                                                                                                                                                                                                                                                      build:
                                                                                                                                                                                                                                                                                          name: Build Frontend Docker Image
                                                                                                                                                                                                                                                                                              runs-on: ubuntu-latest
                                                                                                                                                                                                                                                                                                  needs:
                                                                                                                                                                                                                                                                                                        - lint
                                                                                                                                                                                                                                                                                                              - test
                                                                                                                                                                                                                                                                                                                  defaults:
                                                                                                                                                                                                                                                                                                                        run:
                                                                                                                                                                                                                                                                                                                                working-directory: starter/frontend

                                                                                                                                                                                                                                                                                                                                    steps:
                                                                                                                                                                                                                                                                                                                                          - name: Checkout source
                                                                                                                                                                                                                                                                                                                                                  uses: actions/checkout@v4

                                                                                                                                                                                                                                                                                                                                                        - name: Set up Node.js
                                                                                                                                                                                                                                                                                                                                                                uses: actions/setup-node@v4
                                                                                                                                                                                                                                                                                                                                                                        with:
                                                                                                                                                                                                                                                                                                                                                                                  node-version: 18.x
                                                                                                                                                                                                                                                                                                                                                                                            cache: npm
                                                                                                                                                                                                                                                                                                                                                                                                      cache-dependency-path: starter/frontend/package-lock.json

                                                                                                                                                                                                                                                                                                                                                                                                            - name: Install dependencies
                                                                                                                                                                                                                                                                                                                                                                                                                    run: npm ci

                                                                                                                                                                                                                                                                                                                                                                                                                          - name: Run tests
                                                                                                                                                                                                                                                                                                                                                                                                                                  run: CI=true npm test

                                                                                                                                                                                                                                                                                                                                                                                                                                        - name: Build Docker image
                                                                                                                                                                                                                                                                                                                                                                                                                                                env:
                                                                                                                                                                                                                                                                                                                                                                                                                                                          REACT_APP_MOVIE_API_URL: ${{ secrets.REACT_APP_MOVIE_API_URL }}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            docker build \
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        --build-arg REACT_APP_MOVIE_API_URL="$REACT_APP_MOVIE_API_URL" \
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    --tag mp-frontend:ci-test .